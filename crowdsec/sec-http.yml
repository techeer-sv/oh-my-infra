  secured-whoami:
    image: traefik/whoami
    container_name: secured-whoami
    restart: unless-stopped
    networks:
      - traefik-network
    cpus: "0.1"
    mem_limit: "64m"
    labels:
      logging: enabled
      traefik.enable: "true"
      traefik.docker.network: "traefik-network"
      traefik.http.services.whoami.loadbalancer.server.port: "80"
      traefik.http.routers.whoami.rule: "PathPrefix(`/`)"
      traefik.http.routers.whoami.entrypoints: "web"
      traefik.http.routers.whoami.middlewares: "crowdsec@docker"
      traefik.http.middlewares.crowdsec.plugin.crowdsec-bouncer-traefik-plugin.enabled: true
      traefik.http.middlewares.crowdsec.plugin.crowdsec-bouncer-traefik-plugin.crowdseclapikey: "traefik-secret-key" # 꼭 바꾸삼
      traefik.http.middlewares.crowdsec.plugin.crowdsec-bouncer-traefik-plugin.crowdseclapischeme: "http"
      traefik.http.middlewares.crowdsec.plugin.crowdsec-bouncer-traefik-plugin.crowdseclapihost: "secured-crowdsec:8080"
      traefik.http.middlewares.crowdsec.plugin.crowdsec-bouncer-traefik-plugin.crowdsecappsecenabled: "true"
      traefik.http.middlewares.crowdsec.plugin.crowdsec-bouncer-traefik-plugin.crowdsecappsechost: "secured-crowdsec:7422"

