  secured-alloy:
    image: grafana/alloy:v1.13.2
    container_name: securedalloy
    command: run /etc/alloy/config.alloy
    volumes:
      - ./alloy-config.alloy:/etc/alloy/config.alloy
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - traefik-logs:/traefik/logs:ro
    restart: unless-stopped
    cpus: "0.2"
    mem_limit: "256m"
  
  secured-cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    container_name: secured-cadvisor
    privileged: true
    ports:
      - "8081:8080"
    networks:
      - metrics-network
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    restart: unless-stopped
    cpus: "0.3"
    mem_limit: "256m"

volumes:
  ui-data:
  grafana-data-2:
  traefik-logs:
  crowdsec-db:
  crowdsec-config:

networks:
  crowdsec-network:
    external: true
    name: crowdsec-network
  traefik-network:
    external: true
    name: traefik-network
